<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>
    <link rel="stylesheet" href="SeaToSky.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="signin-body">
    <div id="header-placeholder"></div>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-right">
                <h2>Sign in</h2>
                <form>
                    <input type="email" placeholder="Email" id="emailLogin">
                    <div class="password-field">
                        <input type="password" id="passwordLogin" placeholder="Password">
                        <span class="toggle-eye" id="togglePassword">
                            <span class="eye" id="showEye"><img src="show.svg"></span>
                            <span class="eye" id="hideEye" style="display:none;"><img src="hide.svg"></span>
                        </span>
                    </div>
                    <a class="forgot" href="#">Forgot password?</a>
                    <button type="submit">Sign in</button>
                    <p>
                        Don’t have an account?
                        <a href="signup.html">Sign up</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="header.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
