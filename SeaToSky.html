<!DOCTYPE html>
<html>
    <head>
        <title>Sea to Sky</title>
        <link rel="icon" type="image/png" href="sea2sky.png">
        <meta charset="utf-8">
        <link rel="stylesheet" href="SeaToSky.css">
    </head>
    <body>
        <div id="header-placeholder"></div>
        <section id="first">
            <div id="hero">
                <h2>Discover Montenegro</h2>
                <h3>from sea to sky</h3>
            </div>
            <div class="hero-content">
                <div class="search-bar">
                    <div class="field">
                        <span class="field-label">Destination</span>
                        <select id="city-input">
                            <option value="">Any city</option>
                            <option>Podgorica</option>
                            <option>Nikšić</option>
                            <option>Bijelo Polje</option>
                            <option>Herceg Novi</option>
                            <option>Pljevlja</option>
                            <option>Bar</option>
                            <option>Budva</option>
                            <option>Cetinje</option>
                            <option>Berane</option>
                            <option>Ulcinj</option>
                            <option>Tivat</option>
                            <option>Kotor</option>
                            <option>Rožaje</option>
                            <option>Mojkovac</option>
                            <option>Kolašin</option>
                            <option>Žabljak</option>
                            <option>Plav</option>
                            <option>Andrijevica</option>
                            <option>Danilovgrad</option>
                            <option>Šavnik</option>
                            <option>Plužine</option>
                            <option>Petnjica</option>
                            <option>Gusinje</option>
                            <option>Tuzi</option>
                            <option>Zeta</option>
                        </select>
                    </div>
                    <div class="field">
                        <span class="field-label">Type</span>
                        <select>
                            <option value="">Choose type</option>
                            <option value="coastal">Coastal</option>
                            <option value="mountain">Mountain</option>
                            <option value="national-park">National Park</option>
                        </select>
                    </div>
                    <div class="field">
                        <span class="field-label">Date</span>
                        <input type="date">
                    </div>
                    <div class="field">
                        <span class="field-label">Visitors</span>
                        <select>
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                            <option>4+</option>
                        </select>
                    </div>
                    <button class="search-btn">Search →</button>
                </div>
            </div>
            <button class="scroll-btn" id="firstScroll">
                <span>&#8595;</span>
            </button>
        </section>
        <script src="header.js" defer></script>
        <script src="main.js" defer></script>
    </body>
</html>
